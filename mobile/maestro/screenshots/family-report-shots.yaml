# Opens the newest progress report at "Where the shots went" (the target with every shot), for the stores'
# screenshots (npm run publish:screenshots, scripts/phone.mjs). Starts from the family's signed-in app.
appId: com.skyarcacademy.app
---
- runFlow:
    file: family-report.yaml
- scrollUntilVisible:
    element:
      id: "replay-play"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
