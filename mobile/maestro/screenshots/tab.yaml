# Opens one tab of the office's app, for the stores' screenshots (npm run publish:screenshots, scripts/phone.mjs): TAB
# is today, schedule, scan, students or more, and LABEL its name on the tab bar. Starts from the signed-in app.
#   maestro test -e TAB=schedule -e LABEL=Schedule maestro/screenshots/tab.yaml
appId: com.skyarcacademy.app
---
- runFlow:
    file: ../steps/tab.yaml
    env:
      TAB: ${TAB}
      LABEL: ${LABEL}
- waitForAnimationToEnd:
    timeout: 5000
