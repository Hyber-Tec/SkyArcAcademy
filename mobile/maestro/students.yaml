# The Students tab: the list, the filter, a search, and a student's page with their family, classes, scores and files;
# a score opens its own screen, where its shots play back one by one.
# Run after sign-in.yaml (the practice owner; the sample academy has students with scores and SIUS PDFs):
#   maestro test maestro/students.yaml
appId: com.skyarcacademy.app
---
- launchApp:
    stopApp: false
- runFlow:
    file: steps/tab.yaml
    env:
      TAB: students
      LABEL: Students
- extendedWaitUntil:
    visible:
      id: "students-screen"
    timeout: 30000
- tapOn:
    id: "students-filter-all"
- tapOn:
    id: "students-filter-active"
- tapOn:
    id: "student-row-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "student-screen"
    timeout: 15000
- assertVisible:
    id: "student-family"
# To the first score: a student with many is taller than the screen, so the scores' section never shows whole.
- scrollUntilVisible:
    element:
      id: "student-score-.*"
    direction: DOWN
    centerElement: true
    optional: true
# A score opens its own screen, when the student has one: its shots play back on the target.
- runFlow:
    when:
      visible:
        id: "student-score-.*"
    commands:
      - tapOn:
          id: "student-score-.*"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "score-total"
          timeout: 20000
      - runFlow:
          when:
            visible:
              id: "replay-play"
          commands:
            - tapOn:
                id: "replay-play"
            - extendedWaitUntil:
                visible:
                  id: "replay-readout"
                  text: "(Series 1 · )?Shot [2-9].*"
                timeout: 10000
            - tapOn:
                id: "replay-play"
      - runFlow:
          file: steps/back.yaml
      - extendedWaitUntil:
          visible:
            id: "student-screen"
          timeout: 15000
# To the first file, as for the scores: the Drive's section can be taller than the screen.
- scrollUntilVisible:
    element:
      id: "student-file-.*"
    direction: DOWN
    centerElement: true
    optional: true
# A file opens full screen, when the student has one.
- runFlow:
    when:
      visible:
        id: "student-file-.*"
    commands:
      - tapOn:
          id: "student-file-.*"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "file-screen"
          timeout: 20000
      - tapOn:
          id: "file-close"
- runFlow:
    file: steps/back.yaml
