# Signs in with an email and a password (npm run phone:test gives it the practice owner and the practice password).
#   maestro test -e EMAIL=owner@example.test -e PASSWORD=… maestro/sign-in.yaml
appId: com.skyarcacademy.app
---
- launchApp
# Development builds: Expo's developer menu may open over the app on a new install.
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - swipe:
          start: 50%, 55%
          end: 50%, 98%
          duration: 300
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "sign-in"
    timeout: 60000
# The screen settles first (a development build may still be loading its code): what is typed before it does is lost.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "email"
- inputText: ${EMAIL}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
# The keyboard's Go key submits the form (no tap that the moving layout could misplace).
- pressKey: Enter
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
# The welcome tour opens over Home after an account's first sign-in on a phone (a cleared app counts as a new phone):
# skipped, as the flows check the screens behind it. More's "Take the tour" plays it again. Its card comes a moment
# after Home shows (the first step opens its tab first), so it's waited for on its own; an account that has had it
# waits those seconds for nothing.
- extendedWaitUntil:
    visible:
      id: "tour-skip|tab-today|today-screen|family-tab-home|family-home"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "tour-skip"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible:
        id: "tour-skip"
    commands:
      - tapOn:
          id: "tour-skip"
# Home (the staff's or the family's): its tab on iPhone; on Android Maestro can't see a tab's id, so the screen's own.
- extendedWaitUntil:
    visible:
      id: "tab-today|today-screen|family-tab-home|family-home"
    timeout: 60000
