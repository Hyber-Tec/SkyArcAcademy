# The family's app, as the sample parent (two children; the practice password): Home with the child switcher, a class's
# sheet, the academy's news (a post opened, and All news when Home doesn't show them all) and the latest scores, Classes
# (upcoming and past, and the months with a day's class opened), Scores (each child's figures, one child's, a result
# with its shots played back, compared with another, its original opened and closed), Reports and a report with its
# shots played back, and More (the appearance, the delete-account dialog opened and canceled). It changes nothing but
# the report's "Viewed" and the parent's read receipt of the post opened. Signs out, in as the parent, then back in as
# the owner the other flows expect.
# Run after sign-in.yaml (the practice owner):
#   maestro test -e EMAIL=owner@example.test -e PASSWORD=… maestro/family.yaml
appId: com.skyarcacademy.app
---
- launchApp:
    stopApp: false
- runFlow:
    file: steps/tab.yaml
    env:
      TAB: more
      LABEL: More
- scrollUntilVisible:
    element:
      id: "more-sign-out"
    direction: DOWN
# Once more, so the row isn't left under the floating tab bar.
- scroll
- tapOn:
    id: "more-sign-out"
- runFlow:
    file: sign-in.yaml
    env:
      EMAIL: jiyeon.hwang@skyarc-sample.test
# Home: the greeting, the children, each one's next class, and a class's sheet.
- extendedWaitUntil:
    visible:
      id: "family-home"
    timeout: 30000
- assertVisible:
    id: "family-home-greeting"
- assertVisible:
    id: "family-child-filter"
- extendedWaitUntil:
    visible:
      id: "family-next"
    timeout: 30000
- tapOn:
    id: "family-child-sample-.*"
    index: 0
- tapOn:
    id: "family-child-all"
- runFlow:
    when:
      visible:
        id: "family-next-.*"
    commands:
      - tapOn:
          id: "family-next-.*"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "family-session-students"
          timeout: 15000
      - tapOn:
          id: "family-session-close"
# The academy's news for families (the sample data shows two posts to families): a post opened, its title, when and by
# whom, and back to Home; the News page, when Home doesn't show every post.
# Centred, so the post isn't left under the floating tab bar.
- scrollUntilVisible:
    element:
      id: "family-home-news-.*"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "family-home-news-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "news-post-title"
    timeout: 15000
- assertVisible:
    id: "news-post-meta"
- runFlow:
    file: steps/back.yaml
- extendedWaitUntil:
    visible:
      id: "family-home-news"
    timeout: 10000
- runFlow:
    when:
      visible:
        id: "family-home-all-news"
    commands:
      - scrollUntilVisible:
          element:
            id: "family-home-all-news"
          direction: DOWN
          centerElement: true
      - tapOn:
          id: "family-home-all-news"
      - extendedWaitUntil:
          visible:
            id: "family-news"
          timeout: 15000
      - runFlow:
          file: steps/back.yaml
# The latest scores, and all of them a tap away (the Scores tab).
- scrollUntilVisible:
    element:
      id: "family-home-scores"
    direction: DOWN
- runFlow:
    when:
      visible:
        id: "family-home-all-scores"
    commands:
      - tapOn:
          id: "family-home-all-scores"
      - extendedWaitUntil:
          visible:
            id: "family-scores"
          timeout: 15000
# Classes: what's coming, then what's past, and a class's sheet. Times the academy suggests and requests come first, so
# each control is scrolled to before it's tapped (a family with several requests has them further down).
- runFlow:
    file: steps/family-tab.yaml
    env:
      TAB: classes
      LABEL: Classes
- extendedWaitUntil:
    visible:
      id: "family-classes"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "family-classes-show-past"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "family-classes-show-past"
- extendedWaitUntil:
    visible:
      id: "family-classes-list"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "family-class-.*"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "family-class-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "family-session-sheet"
    timeout: 15000
- tapOn:
    id: "family-session-close"
- scrollUntilVisible:
    element:
      id: "family-classes-show-upcoming"
    direction: UP
    centerElement: true
- tapOn:
    id: "family-classes-show-upcoming"
# The months: each day marked with the children's classes and the day chosen under them (today, or the next day with a
# class), a class's sheet opened from it, then the list again.
- scrollUntilVisible:
    element:
      id: "family-classes-view-month"
    direction: UP
- tapOn:
    id: "family-classes-view-month"
- extendedWaitUntil:
    visible:
      id: "family-month-day-title"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "family-month-next"
    commands:
      - tapOn:
          id: "family-month-next"
- runFlow:
    when:
      visible:
        id: "family-month-class-.*"
    commands:
      - tapOn:
          id: "family-month-class-.*"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "family-session-sheet"
          timeout: 15000
      - tapOn:
          id: "family-session-close"
- tapOn:
    id: "family-classes-view-list"
- scrollUntilVisible:
    element:
      id: "family-classes-show"
    direction: DOWN
    timeout: 10000
# Scores: each child's figures (All), then one child's with the scores over time and where the shots went, and a result
# opened: its shots played back as it opens, how it compares, and its original (a SIUS result's PDF or a card's photo)
# opened and closed.
- runFlow:
    file: steps/family-tab.yaml
    env:
      TAB: scores
      LABEL: Scores
- extendedWaitUntil:
    visible:
      id: "family-scores-child-.*"
    timeout: 30000
- tapOn:
    id: "family-child-sample-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "family-scores-summary"
    timeout: 15000
- tapOn:
    id: "family-child-all"
- scrollUntilVisible:
    element:
      id: "family-score-row-.*"
    direction: DOWN
- tapOn:
    id: "family-score-row-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "score-total"
    timeout: 20000
# Its shots play as it opens: played again from the first and paused at once, so the readout holds an early shot. The
# taps don't wait for the screen to settle: on Android it doesn't while the shots play, and the wait (14 s a tap) let
# the whole replay go by first.
- runFlow:
    when:
      visible:
        id: "replay-play"
    commands:
      - tapOn:
          id: "replay-restart"
          waitToSettleTimeoutMs: 500
      - tapOn:
          id: "replay-play"
          waitToSettleTimeoutMs: 500
      - extendedWaitUntil:
          visible:
            id: "replay-readout"
            text: "(Series 1 · )?Shot [1-9] of.*"
          timeout: 10000
- scrollUntilVisible:
    element:
      id: "family-score-compare"
    direction: DOWN
# Side by side with another result of its position (when it has one): two chosen, the choices opened and closed. Its
# modes are brought to the middle of the screen first: a control left under the header is tapped through to the status
# bar, which scrolls the page to its top.
- scrollUntilVisible:
    element:
      id: "family-compare-mode"
    direction: DOWN
    centerElement: true
    optional: true
- runFlow:
    when:
      visible:
        id: "family-compare-mode-choose"
    commands:
      - tapOn:
          id: "family-compare-mode-choose"
      - scrollUntilVisible:
          element:
            id: "family-compare-pick-0"
          direction: DOWN
          centerElement: true
      - tapOn:
          id: "family-compare-pick-0"
      - extendedWaitUntil:
          visible:
            id: "family-compare-choose"
          timeout: 10000
      - tapOn:
          id: "family-compare-choose-cancel"
      - assertVisible:
          id: "family-compare-change"
# Its original, when it has one (a typed card hasn't).
- scrollUntilVisible:
    element:
      id: "family-score-file"
    direction: DOWN
    optional: true
- runFlow:
    when:
      visible:
        id: "family-score-file"
    commands:
      - tapOn:
          id: "family-score-file"
      - extendedWaitUntil:
          visible:
            id: "file-screen"
          timeout: 20000
      - tapOn:
          id: "file-close"
      - extendedWaitUntil:
          visible:
            id: "family-score-screen"
          timeout: 10000
- runFlow:
    file: steps/back.yaml
- extendedWaitUntil:
    visible:
      id: "family-scores"
    timeout: 15000
# Reports: the shared reports, and one opened with its shots played back.
- runFlow:
    file: steps/family-tab.yaml
    env:
      TAB: reports
      LABEL: Reports
- extendedWaitUntil:
    visible:
      id: "family-reports-list"
    timeout: 30000
- tapOn:
    id: "family-report-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "report-student"
    timeout: 15000
- assertVisible:
    id: "report-tiles"
# Scrolled to the readout, under the buttons, so both are on screen.
- scrollUntilVisible:
    element:
      id: "replay-readout"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "replay-play"
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: "replay-readout"
- scrollUntilVisible:
    element:
      id: "report-footer"
    direction: DOWN
- runFlow:
    file: steps/back.yaml
# More: the account and the children, the appearance, the delete-account dialog (canceled), then signing out.
- runFlow:
    file: steps/family-tab.yaml
    env:
      TAB: more
      LABEL: More
- extendedWaitUntil:
    visible:
      id: "family-more"
    timeout: 30000
- assertVisible:
    id: "family-more-account"
- assertVisible:
    id: "family-more-students"
- tapOn:
    id: "family-more-appearance-dark"
- tapOn:
    id: "family-more-appearance-system"
- scrollUntilVisible:
    element:
      id: "delete-account-link"
    direction: DOWN
- scroll
- tapOn:
    id: "delete-account-link"
- extendedWaitUntil:
    visible:
      id: "delete-account-dialog"
    timeout: 10000
- tapOn: "Cancel"
- assertNotVisible:
    id: "delete-account-dialog"
- tapOn:
    id: "family-more-sign-out"
# Back to the owner, for the flows after this one.
- runFlow:
    file: sign-in.yaml
