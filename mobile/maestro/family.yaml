# The family's app, as the sample parent (two children; the practice password): Home with the child switcher, a class's
# sheet and the latest scores, Classes (upcoming and past), Scores (each child's figures, one child's, a result with its
# shots played back, its original opened and closed), Reports and a report with its shots played back, and More (the
# appearance, the delete-account dialog opened and canceled). It changes nothing but the report's "Viewed". Signs out,
# in as the parent, then back in as the owner the other flows expect.
# Run after sign-in.yaml (the practice owner):
#   maestro test -e EMAIL=owner@example.test -e PASSWORD=… maestro/family.yaml
appId: com.skyarcacademy.app
---
- launchApp:
    stopApp: false
- runFlow:
    file: steps/tab.yaml
    env:
      TAB: more
      LABEL: More
- scrollUntilVisible:
    element:
      id: "more-sign-out"
    direction: DOWN
# Once more, so the row isn't left under the floating tab bar.
- scroll
- tapOn:
    id: "more-sign-out"
- runFlow:
    file: sign-in.yaml
    env:
      EMAIL: jiyeon.hwang@skyarc-sample.test
# Home: the greeting, the children, each one's next class, and a class's sheet.
- extendedWaitUntil:
    visible:
      id: "family-home"
    timeout: 30000
- assertVisible:
    id: "family-home-greeting"
- assertVisible:
    id: "family-child-filter"
- extendedWaitUntil:
    visible:
      id: "family-next"
    timeout: 30000
- tapOn:
    id: "family-child-sample-.*"
    index: 0
- tapOn:
    id: "family-child-all"
- runFlow:
    when:
      visible:
        id: "family-next-.*"
    commands:
      - tapOn:
          id: "family-next-.*"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "family-session-students"
          timeout: 15000
      - tapOn:
          id: "family-session-close"
# The latest scores, and all of them a tap away (the Scores tab).
- scrollUntilVisible:
    element:
      id: "family-home-scores"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "family-attendance"
    direction: DOWN
- runFlow:
    when:
      visible:
        id: "family-home-all-scores"
    commands:
      - tapOn:
          id: "family-home-all-scores"
      - extendedWaitUntil:
          visible:
            id: "family-scores"
          timeout: 15000
# Classes: what's coming, then what's past, and a class's sheet.
- runFlow:
    file: steps/family-tab.yaml
    env:
      TAB: classes
      LABEL: Classes
- extendedWaitUntil:
    visible:
      id: "family-classes"
    timeout: 30000
- tapOn:
    id: "family-classes-show-past"
- extendedWaitUntil:
    visible:
      id: "family-classes-list"
    timeout: 30000
- tapOn:
    id: "family-class-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "family-session-sheet"
    timeout: 15000
- tapOn:
    id: "family-session-close"
- tapOn:
    id: "family-classes-show-upcoming"
# Scores: each child's figures (All), then one child's with the scores over time and where the shots went, and a result
# opened: its shots played back as it opens, how it compares, and its original (a SIUS result's PDF or a card's photo)
# opened and closed.
- runFlow:
    file: steps/family-tab.yaml
    env:
      TAB: scores
      LABEL: Scores
- extendedWaitUntil:
    visible:
      id: "family-scores-child-.*"
    timeout: 30000
- tapOn:
    id: "family-child-sample-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "family-scores-summary"
    timeout: 15000
- tapOn:
    id: "family-child-all"
- scrollUntilVisible:
    element:
      id: "family-score-row-.*"
    direction: DOWN
- tapOn:
    id: "family-score-row-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "score-total"
    timeout: 20000
# Its shots play as it opens: played again from the first, then paused.
- runFlow:
    when:
      visible:
        id: "replay-play"
    commands:
      - tapOn:
          id: "replay-restart"
      - extendedWaitUntil:
          visible:
            id: "replay-readout"
            text: "(Series 1 · )?Shot [1-9] of.*"
          timeout: 10000
      - tapOn:
          id: "replay-play"
- scrollUntilVisible:
    element:
      id: "family-score-compare"
    direction: DOWN
# Its original, when it has one (a typed card hasn't).
- scrollUntilVisible:
    element:
      id: "family-score-file"
    direction: DOWN
    optional: true
- runFlow:
    when:
      visible:
        id: "family-score-file"
    commands:
      - tapOn:
          id: "family-score-file"
      - extendedWaitUntil:
          visible:
            id: "file-screen"
          timeout: 20000
      - tapOn:
          id: "file-close"
      - extendedWaitUntil:
          visible:
            id: "family-score-screen"
          timeout: 10000
- runFlow:
    file: steps/back.yaml
- extendedWaitUntil:
    visible:
      id: "family-scores"
    timeout: 15000
# Reports: the shared reports, and one opened with its shots played back.
- runFlow:
    file: steps/family-tab.yaml
    env:
      TAB: reports
      LABEL: Reports
- extendedWaitUntil:
    visible:
      id: "family-reports-list"
    timeout: 30000
- tapOn:
    id: "family-report-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "report-student"
    timeout: 15000
- assertVisible:
    id: "report-tiles"
- scrollUntilVisible:
    element:
      id: "replay-play"
    direction: DOWN
- tapOn:
    id: "replay-play"
- assertVisible:
    id: "replay-readout"
- scrollUntilVisible:
    element:
      id: "report-footer"
    direction: DOWN
- runFlow:
    file: steps/back.yaml
# More: the account and the children, the appearance, the delete-account dialog (canceled), then signing out.
- runFlow:
    file: steps/family-tab.yaml
    env:
      TAB: more
      LABEL: More
- extendedWaitUntil:
    visible:
      id: "family-more"
    timeout: 30000
- assertVisible:
    id: "family-more-account"
- assertVisible:
    id: "family-more-students"
- tapOn:
    id: "family-more-appearance-dark"
- tapOn:
    id: "family-more-appearance-system"
- scrollUntilVisible:
    element:
      id: "delete-account-link"
    direction: DOWN
- scroll
- tapOn:
    id: "delete-account-link"
- extendedWaitUntil:
    visible:
      id: "delete-account-dialog"
    timeout: 10000
- tapOn: "Cancel"
- assertNotVisible:
    id: "delete-account-dialog"
- tapOn:
    id: "family-more-sign-out"
# Back to the owner, for the flows after this one.
- runFlow:
    file: sign-in.yaml
