# Checks every pull request before it can reach main, and main after each merge (two pull requests that pass apart
# can still break together). Once main passes, it deploys main to production (https://skyarcacademy.web.app).
# The checks need no secrets. The deploy signs in to Google Cloud as github-deploy@skyarcacademy.iam.gserviceaccount.com
# through Workload Identity Federation (no key file), which Google allows only for main of this repository.
# See CLAUDE.md and docs/DEPLOY.md. The ruleset on main requires the two check jobs by name.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same pull request cancels the check still running for the previous push; runs on main queue.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: No client material or secrets in the repository
        run: bash scripts/check-repo.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            functions/package-lock.json

      - name: Install
        run: npm ci && npm ci --prefix web && npm ci --prefix functions

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build the website
        run: npm --prefix web run build

      - name: Build the functions
        run: npm --prefix functions run build

  rules:
    name: Security rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # The Firestore emulator needs Java 21 or later.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Cache the emulator
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.32.1

      - name: Install
        run: npm ci

      - name: Firestore rules tests
        run: bash scripts/test-rules.sh

  phone:
    name: Phone app typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # The phone app is only typechecked and linted here, so none of its packages' install scripts are needed.
      - name: Install
        run: npm ci --prefix mobile --ignore-scripts

      # It compiles shared/ too, so a change there that breaks the phone app is caught here.
      - name: Typecheck and lint
        run: npm --prefix mobile run typecheck && npm --prefix mobile run lint

  deploy:
    name: Deploy main to production
    needs: [check, rules]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            functions/package-lock.json

      - name: Install
        run: npm ci --prefix web && npm ci --prefix functions

      # The Firebase web settings live in GitHub secrets, never in the repository (CLAUDE.md, "Secrets").
      - name: Build the website for production
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm --prefix web run build

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1025403274020/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deploy@skyarcacademy.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Hosting, the security rules and the functions
        run: bash scripts/deploy.sh
