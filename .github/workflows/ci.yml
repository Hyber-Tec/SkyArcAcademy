# Checks every pull request before it can reach main, and main after each merge (two pull requests that pass apart
# can still break together). Once main passes, it deploys main to production (https://skyarcacademy.web.app).
# The checks need no secrets. The deploy signs in to Google Cloud as github-deploy@skyarcacademy.iam.gserviceaccount.com
# through Workload Identity Federation (no key file), which Google allows only for main of this repository.
# See CLAUDE.md, "Git and commits", and docs/DEPLOY.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same pull request cancels the check still running for the previous push; runs on main queue.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Repository check and website build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: No client material or secrets in the repository
        run: bash scripts/check-repo.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --prefix web

      - name: Build the website
        run: npm --prefix web run build

  deploy:
    name: Deploy main to production
    needs: [check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --prefix web

      # The Firebase web settings live in GitHub secrets, never in the repository (CLAUDE.md, "Secrets").
      - name: Build the website for production
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm --prefix web run build

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1025403274020/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deploy@skyarcacademy.iam.gserviceaccount.com

      - name: Deploy Hosting and the security rules
        run: npx --yes firebase-tools@15.32.1 deploy --only hosting,firestore,database,storage --project skyarcacademy --non-interactive --force
